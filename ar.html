<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>شجرة مشروبات OVO</title>

<style>
/* OVO brand: cobalt blue band + white, light-blue brush strokes, chunky rounded type, the cup-hugging mascot */
:root{
  --bg:#F3F7FD; --surface:#FFFFFF; --ink:#12305C; --muted:#5D7396; --line:#C9DBF2;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1428; --surface:#11203D; --ink:#E6EEFB; --muted:#9DB0CF; --line:#24395D;
  --blue:#6AA6F2; --blue-soft:#18305A; --sky:#234573; --band:#1A4C94; --on-band:#FFFFFF;
  --hot:#FF8A6C; --hot-soft:#3A2019; --cold:#6AA6F2; --cold-soft:#18305A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1428; --surface:#11203D; --ink:#E6EEFB; --muted:#9DB0CF; --line:#24395D;
  --blue:#6AA6F2; --blue-soft:#18305A; --sky:#234573; --band:#1A4C94; --on-band:#FFFFFF;
  --hot:#FF8A6C; --hot-soft:#3A2019; --cold:#6AA6F2; --cold-soft:#18305A; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{direction:rtl;max-width:760px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--blue);margin:0;text-wrap:balance}
.brand small{display:block;font-size:1.05rem;color:var(--muted);font-family:var(--body);font-weight:500;margin-top:8px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:flex-start}

button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Play */
.trail{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.trail button{font:500 .85rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:3px 12px;border-radius:999px;cursor:pointer}

.step{font-size:.8rem;letter-spacing:.04em;color:var(--muted);font-weight:600}

.opt.hot b,.opt.cold b{font-family:var(--display);font-size:2rem;font-weight:400;line-height:1.1}

.org{width:max-content;min-width:100%}

.org>ul{padding-top:0}
.org li{position:relative;display:flex;flex-direction:column;align-items:center;padding:24px 5px 0}

.tone-hot .chip{background:var(--hot-soft);color:var(--hot)}
.tone-cold .chip{background:var(--cold-soft);color:var(--cold)}
.qbox{display:block;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;max-width:160px;text-align:center;font-size:.88rem;font-weight:500;line-height:1.4;text-wrap:balance;transition:border-color .15s}
.n:hover .qbox{border-color:var(--blue)}
.qbox.root{font-family:var(--display);font-size:1.3rem;font-weight:400;color:var(--blue);max-width:240px;padding:10px 18px}
.count{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.leafcard{display:flex;flex-direction:column;align-items:center;gap:5px}

.list h4{margin:0;padding:4px 8px 6px;font-size:.78rem;color:var(--muted);font-weight:600;unicode-bidi:isolate;border-bottom:1px dashed var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 8px;border-radius:9px}
.row+.row{border-top:1px solid var(--bg)}
.row>span:first-child{display:flex;flex-direction:column;min-width:0}
.row .sub{font-size:.74rem;color:var(--muted)}
.hit{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:12px;background:var(--blue-soft)}

.result-name{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.3}
.size{background:var(--band);border:0;border-radius:999px;padding:8px 18px;color:var(--on-band)}

</style>

const TREE=Q('مزاجك النهارده سخن ولا ساقع؟',[['سخن','حاجة تدفّي',HOT],['ساقع','حاجة تفوّق',COLD]]);

const count=n=>n.t==='d'?1:n.o.reduce((s,o)=>s+count(o.c),0);
const depth=n=>n.t==='d'?0:1+Math.max(...n.o.map(o=>depth(o.c)));
const TOTAL=count(TREE), DEPTH=depth(TREE);
document.getElementById('sub').textContent=`جاوب على كام سؤال ونوصّلك لمشروبك من بين ${TOTAL} اختيار`;
document.getElementById('legend').textContent=`${TOTAL} مشروب، كل واحد في آخر فرع · أطول طريق ${DEPTH} أسئلة`;

const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const sizes=p=>Array.isArray(p)?[[p[0],'M'],[p[1],'L']].filter(x=>x[0]!=null):[[p,'']];
const priceText=p=>sizes(p).map(([v,s])=>(s?s+' ':'')+v).join(' · ')+' ج.م';

/* ---------- play ---------- */
let path=[];
const at=(k)=>{let n=TREE;for(let i=0;i<k;i++)n=n.o[path[i]].c;return n};
function renderPlay(){
  const trail=document.getElementById('trail'),card=document.getElementById('card');
  trail.replaceChildren();card.replaceChildren();
  path.forEach((ix,i)=>{const b=el('button',null,at(i).o[ix].a);b.title='ارجع للسؤال ده';b.onclick=()=>{path=path.slice(0,i);renderPlay()};trail.append(b)});
  const tone=path.length?(path[0]===0?'hot':'cold'):'';
  card.dataset.tone=tone;
  const node=at(path.length);
  if(node.t==='q'){
    card.append(el('div','step',path.length?`سؤال ${path.length+1}`:'السؤال الأول'));
    {const h=el('h2','question');h.append(el('span','hl',node.q));card.append(h)}
    const g=el('div','opts'+(path.length?'':' root'));
    node.o.forEach((o,i)=>{
      const b=el('button','opt'+(path.length?'':(i?' cold':' hot')));
      b.append(el('b',null,o.a));if(o.h)b.append(el('span',null,o.h));
      b.onclick=()=>{path.push(i);renderPlay();window.scrollTo({top:0,behavior:'smooth'})};
      g.append(b)});
    card.append(g);
    if(path.length){const a=el('div','actions');const back=el('button','btn','ارجع خطوة');back.onclick=()=>{path.pop();renderPlay()};a.append(back);card.append(a)}
  }else{
    card.append(el('div','step',`مشروبك بعد ${path.length} أسئلة`));
    {const h=el('h2','result-name');h.append(el('span','hl',node.n));card.append(h)}
    const s=el('div','sizes');
    sizes(node.p).forEach(([v,lab])=>{const d=el('div','size');if(lab)d.append(el('i',null,lab==='M'?'وسط':'كبير'));d.append(el('b',null,v));d.append(el('i',null,'ج.م'));s.append(d)});
    card.append(s);
    if(node.x){const ex=el('div','extras');ex.append(el('h3',null,X[node.x].t));const ul=el('ul');X[node.x].i.forEach(([n,p])=>{const li=el('li');li.append(el('span',null,n),el('b',null,'+'+p));ul.append(li)});ex.append(ul);card.append(ex)}
    const a=el('div','actions');
    const again=el('button','btn primary','ابدأ من الأول');again.onclick=()=>{path=[];renderPlay()};
    const back=el('button','btn','ارجع خطوة');back.onclick=()=>{path.pop();renderPlay()};
    const find=el('button','btn','شوفه في الشجرة');find.onclick=()=>{show('tree');const s=document.getElementById('search');s.value=node.n;filter()};
    a.append(again,back,find);card.append(a);
  }
}

/* ---------- tree ---------- */
const L={"drinks": "مشروب", "empty": "مفيش مشروب بالاسم ده. جرّب كلمة تانية."};
const box=document.getElementById('treebox');
const isLeaf=n=>n.t==='d';
const org=el('div','org');
const prefixOf=list=>{const ps=list.map(x=>x.c.n.split(' · ')[0]);return list.every(x=>x.c.n.includes(' · '))&&ps.every(p=>p===ps[0])?ps[0]:null};
function nodeEl(o,node,tone,d){
  const li=el('li',tone?'tone-'+tone:'');li._d=d;
  if(isLeaf(node)){
    li.classList.add('leafli');
    const c=el('div','leafcard');if(o)c.append(el('span','chip',o.a));
    const b=el('div','dbox');b.append(el('span','drink',node.n),el('span','price',priceText(node.p)));c.append(b);
    li.append(c);li._s=((o?o.a+' ':'')+node.n).toLowerCase();return li;
  }
  const btn=el('button','n');if(o)btn.append(el('span','chip',o.a));
  btn.append(el('span','qbox'+(o?'':' root'),node.q));
  const cnt=el('span','count');btn.append(cnt);li.append(btn);li._s=(o?o.a:'').toLowerCase();
  let kids;
  if(node.o.every(x=>isLeaf(x.c))){
    kids=el('div','list');const pre=prefixOf(node.o);
    if(pre)kids.append(el('h4',null,pre));
    node.o.forEach(x=>{
      const r=el('div','row'),l=el('span');
      if(pre)l.append(el('span','drink',x.a));
      else{l.append(el('span','drink',x.c.n));if(!x.c.n.toLowerCase().includes(x.a.toLowerCase()))l.append(el('span','sub',x.a))}
      r.append(l,el('span','price',priceText(x.c.p)));r._s=(x.a+' '+x.c.n).toLowerCase();kids.append(r)});
  }else{
    kids=el('ul');node.o.forEach((x,i)=>kids.append(nodeEl(x,x.c,d===0?(i?'cold':'hot'):tone,d+1)));
  }
  li.append(kids);
  const n=count(node);
  li._set=open=>{li.classList.toggle('closed',!open);cnt.textContent=open?'−':`+ ${n} ${L.drinks}`;btn.setAttribute('aria-expanded',open)};
  li._set(d<2);
  btn.onclick=()=>{li._set(li.classList.contains('closed'));requestAnimationFrame(()=>btn.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'}))};
  return li;
}
const rootUl=el('ul'),rootLi=nodeEl(null,TREE,'',0);rootUl.append(rootLi);org.append(rootUl);box.append(org);
const empty=el('p','empty',L.empty);empty.hidden=true;box.append(empty);
function centerTree(){rootLi.firstElementChild.scrollIntoView({block:'nearest',inline:'center'})}

function filter(){
  const t=document.getElementById('search').value.trim().toLowerCase();
  box.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));
  let first=null;
  const walk=li=>{
    if(li.classList.contains('leafli')){const m=!!t&&li._s.includes(t);if(m){li.firstElementChild.classList.add('hit');first=first||li.firstElementChild}return m}
    const kids=li.lastElementChild;let any=false;
    if(kids.classList.contains('list')){for(const r of kids.children)if(r._s&&t&&r._s.includes(t)){r.classList.add('hit');first=first||r;any=true}}
    else for(const c of kids.children)any=walk(c)||any;
    li._set(t?(any||li._d===0):li._d<2);
    return any;
  };
  const found=walk(rootLi);
  empty.hidden=!t||found;
  if(first)setTimeout(()=>first.scrollIntoView({block:'center',inline:'center',behavior:'smooth'}),60);
  else if(!t)centerTree();
}
document.getElementById('search').addEventListener('input',filter);
document.getElementById('expand').onclick=()=>box.querySelectorAll('li').forEach(li=>li._set&&li._set(true));
document.getElementById('collapse').onclick=()=>{box.querySelectorAll('li').forEach(li=>li._set&&li._set(li._d===0));centerTree()};
/* mouse drag to pan; touch uses native scrolling */
{let sx=0,sl=0,down=false,moved=false;
box.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down=true;moved=false;sx=e.clientX;sl=box.scrollLeft});
window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>4){moved=true;box.classList.add('dragging')}if(moved)box.scrollLeft=sl-dx});
window.addEventListener('pointerup',()=>{down=false;setTimeout(()=>box.classList.remove('dragging'),0)});
box.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);}
let zoom=1;const setZoom=z=>{zoom=Math.min(1.4,Math.max(.4,z));org.style.zoom=zoom};
document.getElementById('zin').onclick=()=>setZoom(zoom+.15);
document.getElementById('zout').onclick=()=>setZoom(zoom-.15);

/* ---------- tabs ---------- */
function show(which){
  document.getElementById('play').hidden=which!=='play';
  document.getElementById('tree').hidden=which!=='tree';
  document.getElementById('tab-play').setAttribute('aria-selected',which==='play');
  document.getElementById('tab-tree').setAttribute('aria-selected',which==='tree');
  if(which==='tree')requestAnimationFrame(centerTree);
}
document.getElementById('tab-play').onclick=()=>show('play');
document.getElementById('tab-tree').onclick=()=>show('tree');
show(location.hash==='#tree'?'tree':'play');
renderPlay();
